name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "staging/ncmora-${VERSION}-${TARGET}"
          cp "target/${TARGET}/release/cnmplayer" "staging/ncmora-${VERSION}-${TARGET}/"
          strip "staging/ncmora-${VERSION}-${TARGET}/cnmplayer" || true
          tar -C staging -czf "ncmora-${VERSION}-${TARGET}.tar.gz" "ncmora-${VERSION}-${TARGET}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          $folder = "ncmora-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path "staging\$folder" -Force | Out-Null
          Copy-Item "target\$env:TARGET\release\cnmplayer.exe" "staging\$folder\"
          Compress-Archive -Path "staging\$folder" -DestinationPath "$folder.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncmora-${{ matrix.target }}
          path: ncmora-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ncmora-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/ncmora-*
